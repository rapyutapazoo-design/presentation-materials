<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マンション理事会 プレゼン資料ポータル</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #f1f5f9;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        .presentation-list {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #3b82f6;
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card:hover::before {
            transform: scaleY(1);
        }

        .card h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            font-weight: 500;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .icon {
            font-size: 1.4rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.4rem;
            }
            .presentation-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>プレゼン資料ポータル</h1>
        <div class="presentation-list">
            
            <a href="./理事会向け/デジタル化ロードマップ/index.html" class="card">
                <h2><span class="icon">🚀</span> デジタル化ロードマップ</h2>
                <p>マンション管理のデジタル課題と今後の展開スケジュールに関する提案資料。</p>
            </a>

            <a href="./理事会向け/管理室用タブレット比較/index.html" class="card">
                <h2><span class="icon">📱</span> 管理室用タブレット比較</h2>
                <p>導入を検討している管理室用タブレット端末の各機種スペック・コスト比較資料。</p>
            </a>

        </div>
    </div>
</body>
</html>
